<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#34408C" />
    <meta name="description" content="Gestión de órdenes, resultados e informes del laboratorio clínico" />
    <title>Laboratorio clínico</title>
    <script>
      // aplica el tema guardado antes de pintar (evita el destello claro en modo oscuro)
      (function () {
        try {
          var p = localStorage.getItem('lab.theme') || 'system';
          var dark = p === 'dark' || (p === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
